<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login / Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container card" style="margin-top: 100px;">
        <h2 id="auth-title">Login to BlogPlatform</h2>
        <form id="auth-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        <p style="margin-top:15px; font-size:14px; color:#aaa;">
            <span id="toggle-text">Don't have an account?</span> 
            <a href="#" id="toggle-auth">Register here</a>
        </p>
    </div>
    <script src="app.js"></script>
</body>
</html>
